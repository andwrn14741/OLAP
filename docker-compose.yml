services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    container_name: olap_clickhouse
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      # DDL + sample: только scripts/init_ch.sh (ClickHouse не использует initdb.d)
      - ch_data:/var/lib/clickhouse
      - ./data/raw:/var/lib/clickhouse/user_files
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Metabase: после первого входа добавьте ClickHouse-драйвер (см. README)
  metabase:
    image: metabase/metabase:v0.52.16
    container_name: olap_metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - mb_data:/metabase-data
      - ./metabase/plugins:/plugins
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  ch_data:
  mb_data:
